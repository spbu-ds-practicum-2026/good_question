[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semerochka-orders"
version = "0.1.0"
description = "Order Service and Payment Mock for a distributed systems demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "pika>=1.3,<2",
  "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["order_payment*"]

[tool.setuptools.package-data]
"order_payment" = ["migrations/orders/*.sql", "migrations/payments/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires two real PostgreSQL databases", "broker: requires RabbitMQ"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
